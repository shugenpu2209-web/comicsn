<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMICSN 后台管理系统</title>
  <meta name="theme-color" content="#0d1730">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=ui14">
</head>
<body>
  <div id="app"></div>
  <script src="js/store.js?v=api1"></script>
  <script>
    (function () {
      var root = document.getElementById('app');
      function boot() {
        var script = document.createElement('script');
        script.src = 'js/app.js?v=api1';
        document.body.appendChild(script);
      }
      function fail(message) {
        root.innerHTML = '<div class="login-page"><div class="login-card"><h1>无法连接后台</h1><p>' + message + '</p></div></div>';
      }
      if (!window.AdminStore || typeof window.AdminStore.ready !== 'function') {
        fail('后台脚本没有加载。');
        return;
      }
      window.AdminStore.ready().then(boot).catch(function () {
        fail('请先在本机启动 Node 服务后再打开管理台。');
      });
    })();
  </script>
</body>
</html>
